<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Usuarios | Mimo & Co</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AUTH -->
    <script src="auth.js"></script>

    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 12px; }
        .badge-admin { background: #1d4ed8; }
        .badge-user { background: #64748b; }

        /* Mobile */
        @media (max-width: 576px) {
            .table thead { display: none; }
            .table tbody tr { display: block; border-bottom: 1px solid #e5e7eb; padding: 12px; }
            .table tbody td { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border: 0; }
            .table tbody td::before { content: attr(data-label); font-weight: 700; color: #64748b; font-size: 12px; }
        }
    </style>
</head>

<body onload="init()">

<nav class="navbar bg-white shadow-sm px-4">
    <span class="navbar-brand fw-bold">Administracion de Usuarios</span>
    <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm" onclick="irHome()">
            <i class="bi bi-house"></i> Inicio
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Salir
        </button>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Usuarios del sistema</h5>
        <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nuevo</button>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Sucursal</th>
                        <th>Activo</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                    <tr>
                        <td colspan="5" class="text-center py-4">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <form onsubmit="event.preventDefault(); guardarUsuario();">
                <div class="modal-header">
                    <h5 class="modal-title">Usuario</h5>
                    <button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="userId">

                    <div class="mb-2">
                        <label class="form-label">Usuario</label>
                        <input id="usuario" class="form-control" required autocomplete="off">
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Contrasena</label>
                        <input id="password" type="password" class="form-control" autocomplete="new-password">
                        <div class="form-text" id="passwordHelp">
                            En edicion, deja vacio para mantener la actual.
                        </div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Rol</label>
                        <select id="rol" class="form-select">
                            <option value="admin">Admin</option>
                            <option value="usuario">Usuario</option>
                        </select>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Sucursal</label>
                        <input id="sucursal" type="number" class="form-control" min="0" step="1" placeholder="Ej: 10">
                        <div class="form-text">Para rol usuario es obligatorio. Para admin puede quedar vacio.</div>
                    </div>

                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="activo" checked>
                        <label class="form-check-label" for="activo">Activo</label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let modal;

function irHome() {
    window.location.href = '/reporte_index.html';
}

function init() {
    if (!protectPage()) return;

    const user = getUser();
    if (!user || user.rol !== 'admin') {
        alert('Acceso restringido');
        window.location.href = '/';
        return;
    }

    modal = new bootstrap.Modal(document.getElementById('modalUsuario'));
    cargarUsuarios();
}

async function cargarUsuarios() {
    const tbody = document.getElementById('tablaUsuarios');
    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4">Cargando...</td></tr>`;

    try {
        const res = await authFetch('/api/usuarios');
        if (!res.ok) {
            if (res.status === 401) { logout(); return; }
            throw new Error('No se pudo cargar usuarios');
        }

        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Sin usuarios</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(u => `
            <tr>
                <td data-label="Usuario">${escapeHtml(u.usuario)}</td>
                <td data-label="Rol">
                    <span class="badge ${u.rol === 'admin' ? 'badge-admin' : 'badge-user'}">${escapeHtml(u.rol)}</span>
                </td>
                <td data-label="Sucursal">${u.sucursal ?? '-'}</td>
                <td data-label="Activo">${u.activo ? '✅' : '❌'}</td>
                <td class="text-end" data-label="Acciones">
                    <button class="btn btn-sm btn-outline-primary" onclick='editar(${JSON.stringify(u)})' title="Editar">
                        <i class="bi bi-pencil"></i>
                    </button>
                </td>
            </tr>
        `).join('');

    } catch (e) {
        console.error(e);
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Error cargando usuarios</td></tr>`;
    }
}

function openModal() {
    document.getElementById('userId').value = '';
    document.getElementById('usuario').value = '';
    document.getElementById('password').value = '';
    document.getElementById('rol').value = 'usuario';
    document.getElementById('sucursal').value = '';
    document.getElementById('activo').checked = true;

    // Reglas UI: en alta la contrasena es requerida
    document.getElementById('password').required = true;
    document.getElementById('passwordHelp').style.display = 'none';

    modal.show();
}

function editar(user) {
    document.getElementById('userId').value = user.id;
    document.getElementById('usuario').value = user.usuario;
    document.getElementById('rol').value = user.rol;
    document.getElementById('sucursal').value = user.sucursal || '';
    document.getElementById('activo').checked = !!user.activo;
    document.getElementById('password').value = '';

    // En edicion la contrasena NO es requerida
    document.getElementById('password').required = false;
    document.getElementById('passwordHelp').style.display = 'block';

    modal.show();
}

async function guardarUsuario() {
    const id = document.getElementById('userId').value;
    const rol = document.getElementById('rol').value;
    const suc = document.getElementById('sucursal').value;

    if (rol === 'usuario' && (!suc || String(suc).trim() === '')) {
        alert('Para rol usuario debes indicar una sucursal.');
        return;
    }

    const payload = {
        usuario: document.getElementById('usuario').value.trim(),
        password: document.getElementById('password').value,
        rol,
        sucursal: suc ? parseInt(suc, 10) : null,
        activo: document.getElementById('activo').checked
    };

    // Si es edicion y password vacio: no lo mandes
    if (id && (!payload.password || payload.password.trim() === '')) {
        delete payload.password;
    }

    const method = id ? 'PUT' : 'POST';
    const url = id ? `/api/usuarios/${encodeURIComponent(id)}` : '/api/usuarios';

    try {
        const res = await authFetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            modal.hide();
            cargarUsuarios();
            return;
        }

        if (res.status === 401) { logout(); return; }

        let errMsg = 'Error al guardar usuario';
        try {
            const js = await res.json();
            if (js && js.error) errMsg = js.error;
        } catch (_) {}

        alert(errMsg);

    } catch (e) {
        console.error(e);
        alert('Error de conexion');
    }
}

function escapeHtml(str) {
    return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
}
</script>

</body>
</html>
