<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimo & Co | Comparativo Comercial</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --emerald-600: #059669;
            --red-600: #dc2626;
        }

        body { 
            background-color: #f3f4f6; 
            font-family: 'Inter', sans-serif; 
            color: var(--slate-700);
            -webkit-font-smoothing: antialiased;
        }
        
        /* Navbar */
        .nav-header { 
            background: var(--slate-800); 
            color: white; 
            padding: 10px 30px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            height: 60px; 
        }
        .nav-header a { text-decoration: none; color: white; display: flex; align-items: center; }
        .nav-header img { height: 32px; background-color: white; padding: 4px; border-radius: 4px; }
        .nav-header span { font-family: 'Outfit', sans-serif; letter-spacing: 0.5px; font-weight: 300; }

        /* Filtros */
        .filter-container { 
            background: white; 
            border-bottom: 1px solid var(--slate-200); 
            padding: 15px 40px; 
        }
        
        .btn-consultar { 
            background: var(--slate-800); 
            color: white; 
            font-weight: 600; 
            border: none; 
            border-radius: 6px; 
            padding: 8px 20px; 
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-consultar:hover { background: #000; transform: translateY(-1px); }

        /* Contenido Principal */
        .main-content { padding: 30px 40px; }
        .report-card { 
            background: white; 
            border-radius: 12px; 
            border: 1px solid var(--slate-200); 
            overflow: hidden; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); 
        }
        
        h5 { font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--slate-800); }

        /* Tabla Estilo BI */
        .table-comp { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .table-comp th { 
            background: var(--slate-50); 
            border-bottom: 2px solid var(--slate-200); 
            padding: 18px 10px; 
            text-align: center; 
        }
        .table-comp td { border: 1px solid var(--slate-100); padding: 15px 10px; text-align: center; vertical-align: middle; }
        
        .day-label { display: block; font-weight: 800; color: var(--slate-800); font-size: 15px; }
        .day-sub { font-size: 11px; color: var(--slate-600); font-weight: 500; text-transform: uppercase; }
        
        .row-header { 
            text-align: left !important; 
            font-weight: 700; 
            background: var(--slate-50); 
            color: var(--slate-600); 
            width: 200px; 
            padding-left: 25px !important;
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* Valores y Variaciones */
        .main-value { 
            font-size: 17px; 
            font-weight: 700; 
            color: var(--slate-800); 
            margin-bottom: 10px; 
            font-variant-numeric: tabular-nums;
        }
        .var-box { display: flex; flex-direction: column; gap: 5px; }
        .var-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 6px; 
            padding: 3px 8px; 
            border-radius: 5px; 
            font-size: 11px;
            font-weight: 600;
        }
        
        .pos { color: var(--emerald-600); border: 1px solid #d1fae5; background: #f0fdf4; }
        .neg { color: var(--red-600); border: 1px solid #fee2e2; background: #fef2f2; }
        .neu { color: var(--slate-600); background: var(--slate-50); border: 1px solid var(--slate-200); }

        .spinner-container { padding: 80px; text-align: center; }
    </style>
</head>
<body onload="init()">

<div class="nav-header">
    <a href="reporte_index.html">
        <img src="Logo.png" alt="Mimo">
        <span class="ms-3">BI SYSTEM | <strong>MIMO & CO</strong></span>
    </a>
    <i class="bi bi-arrow-left-right fs-5"></i>
</div>

<div class="filter-container">
    <div class="row g-3 align-items-center">
        <div class="col-md-4">
            <label class="small fw-bold text-secondary mb-1">Sucursal</label>
            <select id="sucursal" class="form-select shadow-none border-secondary-subtle"></select>
        </div>
        <div class="col-md-2 pt-4">
            <button class="btn-consultar w-100 shadow-sm" onclick="consultar()">
                <i class="bi bi-arrow-repeat me-2"></i>Actualizar
            </button>
        </div>
    </div>
</div>

<div class="main-content">
    <h5 class="mb-4">Comparativo de Rendimiento (7 Días)</h5>
    
    <div class="report-card">
        <table class="table-comp">
            <thead id="thead-comp">
                </thead>
            <tbody id="tbody-comp">
                <tr><td colspan="8" class="p-5 text-muted text-center">Inicie la consulta para ver los datos históricos.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4 p-3 bg-white border rounded border-info-subtle shadow-sm d-flex align-items-center">
        <i class="bi bi-info-circle-fill text-info fs-5 me-3"></i>
        <p class="mb-0 small text-muted">
            <strong>Cómo leer:</strong> Los porcentajes indican la variación respecto al mismo día de la <strong>Semana Anterior</strong> (arriba) y del <strong>Mes Anterior</strong> (abajo, 28 días atrás).
        </p>
    </div>
</div>

<script>
    async function init() {
        const res = await fetch('/api/sucursales');
        const sucs = await res.json();
        document.getElementById('sucursal').innerHTML = sucs.map(s => `<option value="${s.CODSUC}">${s.NOMBRE}</option>`).join('');
    }

    function getVarRow(actual, historico, labelFecha) {
        if (!historico || historico === 0) return `<div class="var-row neu"><span>0.0%</span> <span class="ms-1 fw-normal">vs ${labelFecha}</span></div>`;
        
        const diff = ((actual - historico) / historico) * 100;
        const icon = diff >= 0 ? 'bi-caret-up-fill' : 'bi-caret-down-fill';
        const colorClass = diff >= 0 ? 'pos' : 'neg';
        
        return `
            <div class="var-row ${colorClass}">
                <i class="bi ${icon}"></i>
                <span>${diff > 0 ? '+' : ''}${diff.toFixed(1)}%</span>
                <span class="ms-1 fw-normal" style="opacity: 0.7">vs ${labelFecha}</span>
            </div>`;
    }

    async function consultar() {
        const suc = document.getElementById('sucursal').value;
        const tbody = document.getElementById('tbody-comp');
        tbody.innerHTML = `<tr><td colspan="8" class="spinner-container"><div class="spinner-border text-primary"></div></td></tr>`;

        try {
            const res = await fetch(`/api/reporte/comparativo-ventas?sucursal=${suc}`);
            const data = await res.json();

            // 1. Cabecera dinámica
            let headHtml = `<tr><th class="row-header">MÉTRICA / FECHA</th>`;
            data.forEach(d => {
                headHtml += `
                    <th>
                        <span class="day-label">${d.FechaLabel}</span>
                        <span class="day-sub">${d.DiaSemana}</span>
                    </th>`;
            });
            document.getElementById('thead-comp').innerHTML = headHtml + `</tr>`;

            // 2. Filas de datos
            const rows = [
                { label: 'FACTURACIÓN ($)', actStr: 'MontoActStr', valPure: 'MontoAct', sem: 'MontoSem', mes: 'MontoMes', type: 'money' },
                { label: 'UNIDADES (CANT)', actStr: 'UniAct', valPure: 'UniAct', sem: 'UniSem', mes: 'UniMes', type: 'num' }
            ];

            let bodyHtml = "";
            rows.forEach(row => {
                bodyHtml += `<tr><td class="row-header">${row.label}</td>`;
                data.forEach(d => {
                    // Si es número, aplicamos formato de miles; si es money usamos el string que ya viene con $ de SQL
                    const displayVal = row.type === 'num' ? d[row.actStr].toLocaleString('es-AR') : d[row.actStr];
                    const valActual = d[row.valPure];

                    bodyHtml += `
                        <td>
                            <div class="main-value">${displayVal}</div>
                            <div class="var-box">
                                ${getVarRow(valActual, d[row.sem], d.LabelSem)}
                                ${getVarRow(valActual, d[row.mes], d.LabelMes)}
                            </div>
                        </td>`;
                });
                bodyHtml += `</tr>`;
            });

            tbody.innerHTML = bodyHtml;

        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="8" class="p-5 text-danger text-center">Error: ${err.message}</td></tr>`;
        }
    }
</script>
</body>
</html>
