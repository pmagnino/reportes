<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mimo & Co | Grilla Consolidada</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root { --navy: #1e293b; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-500: #64748b; }
        
        body { 
            background-color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            font-size: 11px; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow: hidden; 
        }
        
        .header-bar { background: var(--navy); color: white; padding: 0 20px; display: flex; align-items: center; min-height: 50px; flex-shrink: 0; }
        .header-bar a { text-decoration: none; color: white; display: flex; align-items: center; }
        .header-bar img { height: 24px; background: white; padding: 2px; border-radius: 4px; margin-right: 12px; }
        .header-title { font-family: 'Outfit', sans-serif; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .filter-area { background: white; border-bottom: 1px solid var(--slate-200); padding: 12px 20px; flex-shrink: 0; }
        .label-sm { font-size: 9px; font-weight: 800; color: var(--slate-500); text-transform: uppercase; margin-bottom: 4px; display: block; }

        .grid-viewport { 
            flex-grow: 1; 
            overflow: auto; 
            background: #fff;
            position: relative;
        }

        .table-sabana { border-collapse: separate; border-spacing: 0; width: 100%; }

        .table-sabana thead th { 
            position: sticky; 
            top: 0; 
            background: #f8fafc; 
            z-index: 10; 
            padding: 10px;
            border-bottom: 2px solid var(--slate-200);
            border-right: 1px solid var(--slate-200);
            font-family: 'Outfit', sans-serif;
            font-size: 9px;
            text-transform: uppercase; 
            color: var(--slate-500);
            text-align: center;
            min-width: 125px; /* Más ancho para el formato moneda completo */
        }

        .sticky-suc { 
            position: sticky; 
            left: 0; 
            background: white !important; 
            z-index: 11; 
            min-width: 180px;
            border-right: 2px solid var(--slate-200) !important;
            font-weight: 700;
            color: var(--navy);
            text-align: left !important;
            box-shadow: 2px 0 5px rgba(0,0,0,0.03);
        }

        .table-sabana thead th.sticky-suc { z-index: 12; top: 0; }

        .table-sabana td { 
            padding: 8px 12px; 
            border-bottom: 1px solid #f1f5f9; 
            border-right: 1px solid #f1f5f9;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .col-total { 
            background: #f1f5f9 !important; 
            font-weight: 800; 
            color: var(--navy); 
            border-left: 2px solid var(--slate-200) !important; 
            position: sticky;
            right: 0;
            z-index: 9;
        }

        .val-zero { color: #cbd5e1; font-weight: 400; }
        .btn-run { background: var(--navy); color: white; font-size: 10px; font-weight: 700; height: 32px; border: none; padding: 0 20px; border-radius: 4px; transition: 0.2s; }
        .btn-run:hover { background: #000; transform: scale(1.02); }

    </style>
</head>
<body onload="init()">

<div class="header-bar">
    <a href="reporte_index.html">
        <img src="Logo.png" alt="Mimo">
        <span class="header-title">Ventas Consolidadas por Día</span>
    </a>
</div>

<div class="filter-area shadow-sm">
    <div class="d-flex align-items-end gap-3">
        <div style="width: 150px;">
            <span class="label-sm">Desde</span>
            <input type="date" id="desde" class="form-control form-control-sm shadow-none">
        </div>
        <div style="width: 150px;">
            <span class="label-sm">Hasta</span>
            <input type="date" id="hasta" class="form-control form-control-sm shadow-none">
        </div>
        <button class="btn-run" onclick="consultar()">PROCESAR RED</button>
    </div>
</div>

<div class="grid-viewport">
    <table class="table-sabana" id="tabla-datos">
        <thead id="res-head"></thead>
        <tbody id="res-body"></tbody>
    </table>
</div>

<script>
    const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2 });

    function init() {
        let hoy = new Date();
        let inicio = new Date();
        inicio.setDate(hoy.getDate() - 7);
        document.getElementById('desde').value = inicio.toISOString().split('T')[0];
        document.getElementById('hasta').value = hoy.toISOString().split('T')[0];
    }

    async function consultar() {
        const resBody = document.getElementById('res-body');
        const resHead = document.getElementById('res-head');
        resBody.innerHTML = `<tr><td colspan="30" class="p-5 text-center"><div class="spinner-border spinner-border-sm text-primary"></div><br>Sincronizando montos...</td></tr>`;

        try {
            const res = await fetch(`/api/reporte/ventas-grilla-diaria?desde=${document.getElementById('desde').value}&hasta=${document.getElementById('hasta').value}`);
            const data = await res.json();

            if (data.length === 0) {
                resBody.innerHTML = '<tr><td class="p-4">No se registran ventas en el período.</td></tr>';
                return;
            }

            const keys = Object.keys(data[0]);
            
            // Header
            resHead.innerHTML = `<tr>${keys.map(k => {
                let label = k === 'TOTAL_SUCURSAL' ? 'TOTAL ACUM.' : k;
                let css = k === 'SUCURSAL' ? 'sticky-suc' : (k === 'TOTAL_SUCURSAL' ? 'col-total' : '');
                return `<th class="${css}">${label}</th>`;
            }).join('')}</tr>`;

            // Filas
            resBody.innerHTML = data.map(row => `
                <tr>
                    ${keys.map(k => {
                        const val = row[k];
                        if (k === 'SUCURSAL') return `<td class="sticky-suc">${val}</td>`;
                        
                        const num = parseFloat(val) || 0;
                        const isTotal = k === 'TOTAL_SUCURSAL';
                        const displayVal = num === 0 ? `<span class="val-zero">${fmt.format(0)}</span>` : fmt.format(num);
                        
                        return `<td class="${isTotal ? 'col-total' : ''}">${displayVal}</td>`;
                    }).join('')}
                </tr>
            `).join('');

        } catch (err) {
            resBody.innerHTML = `<tr><td class="alert alert-danger">Error: ${err.message}</td></tr>`;
        }
    }
</script>
</body>
</html>
