<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimo & Co | Login BI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AUTH -->
  <script src="auth.js"></script>

  <style>
    :root { --navy: #1e293b; }
    body {
      background-color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-card h5 {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--navy);
      letter-spacing: 1px;
      margin-bottom: 25px;
    }
    .btn-dark { background-color: var(--navy); border: none; padding: 12px; font-weight: 600; }
    .btn-dark:hover { background-color: #000; }
  </style>
</head>
<body>

<div class="login-card">
  <img src="Logo.png" alt="Mimo" style="height: 40px; margin-bottom: 20px;">
  <h5>Ingreso al Sistema BI</h5>

  <input id="usuario" class="form-control mb-3" placeholder="Usuario" autocomplete="username">
  <input id="password" type="password" class="form-control mb-4" placeholder="Contraseña" autocomplete="current-password">

  <button id="btnIngresar" class="btn btn-dark w-100" onclick="login()">INGRESAR</button>

  <div id="msg" class="text-danger text-center mt-3 small fw-bold"></div>
</div>

<script>
  // Si ya está logueado, mandalo directo
  (function(){
    if (getToken()) {
      window.location.href = '/reporte_index.html';
    }
  })();

  async function login() {
    const usuario = document.getElementById('usuario').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnIngresar');

    msg.innerText = "";
    btn.disabled = true;
    btn.innerText = "Verificando...";

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password })
      });

      let data = {};
      try { data = await res.json(); } catch {}

      if (res.ok && data.token && data.user) {
        // Guardamos token + user como espera auth.js
        setSession(data.token, data.user);

        // Redirect sin cache raro
        window.location.href = '/reporte_index.html';
        return;
      }

      btn.disabled = false;
      btn.innerText = "INGRESAR";
      msg.innerText = (data && data.error) ? data.error : 'Usuario o clave incorrectos';

    } catch (err) {
      btn.disabled = false;
      btn.innerText = "INGRESAR";
      msg.innerText = "Error de conexión con el servidor";
    }
  }

  // Enter
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
