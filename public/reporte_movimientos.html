<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mimo & Co | Movimientos de Mercadería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Calibri', sans-serif; color: #475569; font-size: 14px; }
        .header-bar { background: #1e293b; color: white; padding: 12px 30px; display: flex; align-items: center; }
        .header-bar img { height: 35px; margin-right: 20px; }
        .card-pro { background: white; border-radius: 10px; border: 1px solid #e2e8f0; padding: 25px; margin-bottom: 20px; }
        .label-sm { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; display: block; }
        
        .info-note { font-size: 12px; color: #94a3b8; font-style: italic; border-left: 3px solid #cbd5e1; padding-left: 10px; margin-bottom: 20px; }
        
        /* Cabecera Clickable */
        .ticket-header { 
            background: #f8fafc; 
            padding: 12px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .ticket-header:hover { background: #f1f5f9; }
        
        .concepto-tag { font-size: 11px; background: #64748b; color: #ffffff; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; font-weight: 700; }
        
        /* Contenedor colapsable */
        .items-container { display: none; background: white; border-top: 1px solid #f1f5f9; }
        .item-grid { padding: 10px 40px; display: grid; grid-template-columns: 3fr 1fr; align-items: center; font-size: 15px; border-bottom: 1px solid #f8fafc; }
        .item-grid:last-child { border-bottom: none; }
    </style>
</head>
<body onload="init()">
<div class="header-bar shadow-sm">
    <a href="reporte_index.html" style="text-decoration: none; color: white; display: flex; align-items: center;">
        <img src="Logo.png" alt="Mimo & Co"><span class="ms-2 text-uppercase" style="font-weight: 300; letter-spacing: 1px;">Movimientos de Mercadería</span>
    </a>
</div>

<div class="container-fluid py-4 px-5">
    <div class="card-pro">
        <div class="row g-3 align-items-end">
            <div class="col-md-3"><span class="label-sm">Sucursal</span><select id="sucursal" class="form-select border-0 bg-light shadow-none"></select></div>
            <div class="col-md-2"><span class="label-sm">Desde</span><input type="date" id="desde" class="form-control border-0 bg-light shadow-none"></div>
            <div class="col-md-2"><span class="label-sm">Hasta</span><input type="date" id="hasta" class="form-control border-0 bg-light shadow-none"></div>
            <div class="col-md-3"><span class="label-sm">Filtrar Artículo</span><input type="text" id="articulo" class="form-control border-0 bg-light shadow-none" placeholder="Código..."></div>
            <div class="col-md-2"><button class="btn btn-dark w-100 fw-bold py-2 btn-sm" onclick="consultar()">CONSULTAR</button></div>
        </div>
    </div>

    <div id="cont-resultados" style="display: none;">
        <div class="info-note">
            <strong>Nota metodológica:</strong> Este reporte muestra ingresos (IE) y egresos (EE) confirmados (ID > 0). Haz clic en un comprobante para ver el detalle de artículos.
        </div>
        <div id="res-body"></div>
    </div>
</div>

<script>
    async function init() {
        const res = await fetch('/api/sucursales');
        const data = await res.json();
        document.getElementById('sucursal').innerHTML = data.map(s => `<option value="${s.CODSUC}">${s.NOMBRE}</option>`).join('');
        document.getElementById('desde').value = document.getElementById('hasta').value = new Date().toISOString().split('T')[0];
    }

    // Función para alternar la visibilidad de los artículos
    function toggleItems(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    async function consultar() {
        try {
            const res = await fetch(`/api/reporte/logistica?sucursal=${document.getElementById('sucursal').value}&desde=${document.getElementById('desde').value}&hasta=${document.getElementById('hasta').value}&articulo=${document.getElementById('articulo').value}`);
            const data = await res.json();
            
            document.getElementById('cont-resultados').style.display = 'block';
            const contenedor = document.getElementById('res-body');

            if (data.length === 0) {
                contenedor.innerHTML = '<div class="card-pro text-center">No se encontraron movimientos.</div>';
                return;
            }

            contenedor.innerHTML = data.map((m, idx) => {
                const collapseId = `items-${idx}`;
                return `
                <div class="card-pro p-0 overflow-hidden mb-3">
                    <div class="ticket-header" onclick="toggleItems('${collapseId}')">
                        <span class="fw-bold" style="color: #1e293b;">
                            ${m.tipo} ${m.prefijo}-${m.numero} 
                            <small class="text-muted ms-3 fw-normal">${m.fecha}</small>
                        </span>
                        <div>
                            <span class="concepto-tag me-2">${m.concepto}</span>
                            <span class="text-muted small">▼</span>
                        </div>
                    </div>
                    <div class="items-container" id="${collapseId}">
                        <div class="py-2">
                            <div class="item-grid fw-bold text-muted small" style="font-size: 11px;">
                                <span>ARTÍCULO</span>
                                <span class="text-end">CANTIDAD</span>
                            </div>
                            ${m.items.map(it => `
                                <div class="item-grid">
                                    <span style="color: #475569;">${it.cod}</span>
                                    <span class="text-end fw-bold" style="color: #1e293b;">${it.cant} u.</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `}).join('');
        } catch (e) {
            alert("Error al cargar los movimientos.");
        }
    }
</script>
</body>
</html>
