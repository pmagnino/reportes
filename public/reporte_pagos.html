<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimo & Co | Medios de Pago</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- AUTH -->
    <script src="auth.js"></script>

    <style>
        :root { --navy:#1e293b; --slate-500:#64748b; }
        body { background:#f8fafc; font-family:'Inter',sans-serif; font-size:13px; }

        .header-bar {
            background:var(--navy); color:white;
            padding:0 20px; height:55px;
            display:flex; align-items:center; justify-content:space-between;
        }
        .header-left { display:flex; align-items:center; gap:12px; text-decoration:none; color:white; }
        .header-bar img { height:26px; background:white; padding:3px; border-radius:4px; }
        .header-title { font-family:'Outfit'; font-size:.8rem; text-transform:uppercase; font-weight:600; }

        .main-content { max-width:1000px; margin:0 auto; padding:15px; }

        .card-pro {
            background:white; border-radius:12px; border:1px solid #e2e8f0;
            padding:15px; margin-bottom:20px;
        }

        .label-sm {
            font-size:9px; font-weight:800; color:var(--slate-500);
            text-transform:uppercase; margin-bottom:4px; display:block;
        }

        .form-select,.form-control {
            font-size:13px; border-radius:8px; height:40px;
            border:1px solid #cbd5e1;
        }

        #miSucursalBox { display:none; }
        #miSucursalBox .pill {
            background:#f1f5f9; border:1px solid #e2e8f0;
            border-radius:10px; height:40px;
            display:flex; align-items:center; padding:0 12px;
            font-weight:700; color:var(--navy);
        }

        .btn-consultar {
            background:var(--navy); color:white;
            font-size:11px; font-weight:700;
            border-radius:8px; height:40px; border:none; width:100%;
        }

        .table-card {
            background:white; border-radius:12px;
            border:1px solid #e2e8f0; overflow:hidden;
        }

        .row-total-highlight td {
            background:var(--navy)!important; color:white!important;
            font-weight:800!important;
        }
    </style>
</head>

<body onload="init()">

<div class="header-bar shadow-sm">
    <a class="header-left" href="reporte_index.html">
        <img src="Logo.png">
        <span class="header-title">Medios de Pago</span>
    </a>
    <button class="btn btn-sm btn-outline-light" onclick="logout()">Salir</button>
</div>

<div class="main-content">

    <div class="card-pro">
        <div class="row g-2 align-items-end">

            <!-- Admin -->
            <div class="col-12 col-md-4" id="sucursalSelectBox">
                <span class="label-sm">Sucursal</span>
                <select id="sucursal" class="form-select"></select>
            </div>

            <!-- Usuario -->
            <div class="col-12 col-md-4" id="miSucursalBox">
                <span class="label-sm">Sucursal</span>
                <div class="pill" id="miSucursalNombre"></div>
            </div>

            <div class="col-6 col-md-3">
                <span class="label-sm">Desde</span>
                <input type="date" id="desde" class="form-control">
            </div>

            <div class="col-6 col-md-3">
                <span class="label-sm">Hasta</span>
                <input type="date" id="hasta" class="form-control">
            </div>

            <div class="col-12 col-md-2">
                <button class="btn-consultar" onclick="consultar()">EJECUTAR</button>
            </div>
        </div>
    </div>

    <div id="cont-resultados" style="display:none">

        <div class="card-pro">
            <canvas id="chartPagos" height="220"></canvas>
        </div>

        <div class="table-card">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th>Medio</th>
                        <th class="text-center">Tks</th>
                        <th class="text-end">Importe</th>
                    </tr>
                </thead>
                <tbody id="res-body"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
let chart;

async function init() {
    if (!protectPage()) return;

    const user = getUser();

    const res = await authFetch('/api/sucursales');
    const sucs = await res.json();

    if (user.rol === 'admin') {
        document.getElementById('sucursalSelectBox').style.display = 'block';
        document.getElementById('miSucursalBox').style.display = 'none';
        document.getElementById('sucursal').innerHTML =
            sucs.map(s => `<option value="${s.CODSUC}">${s.NOMBRE}</option>`).join('');
    } else {
        document.getElementById('sucursalSelectBox').style.display = 'none';
        document.getElementById('miSucursalBox').style.display = 'block';
        document.getElementById('miSucursalNombre').innerText =
            `${sucs[0].NOMBRE} (Suc. ${sucs[0].CODSUC})`;
    }

    const resF = await authFetch('/api/util/fecha-hoy');
    const { hoy } = await resF.json();
    document.getElementById('desde').value =
    document.getElementById('hasta').value = hoy;
}

async function consultar() {
    const btn = document.querySelector('.btn-consultar');
    const tbody = document.getElementById('res-body');
    btn.disabled = true;

    try {
        const user = getUser();
        const d = desde.value;
        const h = hasta.value;

        let url = `/api/reporte/medios-pago?desde=${d}&hasta=${h}`;
        if (user.rol === 'admin') {
            url += `&sucursal=${sucursal.value}`;
        }

        const res = await authFetch(url);
        const data = await res.json();

        document.getElementById('cont-resultados').style.display = 'block';

        let labels=[], values=[], html="", tT=0, tI=0;

        data.forEach(r=>{
            tT+=r.TICKETS; tI+=r.TOTAL_NETO;
            labels.push(r.MEDIO); values.push(r.TOTAL_NETO);
            html+=`<tr>
                <td>${r.MEDIO}</td>
                <td class="text-center">${r.TICKETS}</td>
                <td class="text-end">${r.TOTAL_NETO.toLocaleString('es-AR',{style:'currency',currency:'ARS'})}</td>
            </tr>`;
        });

        html+=`<tr class="row-total-highlight">
            <td>TOTAL</td><td class="text-center">${tT}</td>
            <td class="text-end">${tI.toLocaleString('es-AR',{style:'currency',currency:'ARS'})}</td>
        </tr>`;

        tbody.innerHTML = html;

        if (chart) chart.destroy();
        chart = new Chart(chartPagos,{
            type:'doughnut',
            data:{labels,datasets:[{data:values}]},
            options:{cutout:'70%',plugins:{legend:{position:'bottom'}}}
        });

    } catch(e){
        tbody.innerHTML = `<tr><td colspan="3" class="text-danger text-center">Error</td></tr>`;
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
