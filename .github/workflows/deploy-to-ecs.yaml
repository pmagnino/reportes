# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to main or dev.
#
# Cambios clave:
# - docker build --pull --no-cache (para romper cache y traer el base actualizado)
# - verificacion dentro de la imagen: /etc/alpine-release + apk info -v openssl + openssl version

name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: reportes-franquicia
  ECS_SERVICE: reportes-franquicia
  ECS_CLUSTER: prod
  ECS_CLUSTER_DEV: dev
  ECS_TASK_DEFINITION: .aws/task-definition.json
  ECS_TASK_DEFINITION_DEV: .aws/task-definition-dev.json
  CONTAINER_NAME: reporte-franquicia

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy-dev
    runs-on: ubuntu-latest
    environment: development
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "false"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECS_CLUSTER_DEV: ${{ env.ECS_CLUSTER_DEV }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$ECS_CLUSTER_DEV-$IMAGE_TAG"

          # ✅ Fuerza pull de base image + rompe cache (para probar)
          docker build --pull --no-cache -t "$IMAGE" .

          echo "== Alpine release =="
          docker run --rm "$IMAGE" cat /etc/alpine-release

          echo "== OpenSSL pkg =="
          docker run --rm "$IMAGE" apk info -v openssl || true

          echo "== OpenSSL bin =="
          docker run --rm "$IMAGE" openssl version || true

          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_DEV }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER_DEV }}
          wait-for-service-stability: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "false"

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$ECS_CLUSTER-$IMAGE_TAG"

          # ✅ Fuerza pull de base image + rompe cache (para probar)
          docker build --pull --no-cache -t "$IMAGE" .

          echo "== Alpine release =="
          docker run --rm "$IMAGE" cat /etc/alpine-release

          echo "== OpenSSL pkg =="
          docker run --rm "$IMAGE" apk info -v openssl || true

          echo "== OpenSSL bin =="
          docker run --rm "$IMAGE" openssl version || true

          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
